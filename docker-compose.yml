# Brolly Juniors B2C — the whole stack.
#
#   docker compose up -d --build          everything: db, cache, api, web
#   docker compose up -d postgres redis   data services only (host-run apps)
#
# Then open http://localhost:3000. Only the web port needs to be open; it
# proxies /api/* to the api service over the compose network, so the browser
# still sees a single origin and the refresh cookie stays HttpOnly.
#
# A fresh database has schema but no demo users. Seed it once:
#   docker compose run --rm api python scripts/seed.py
#
# Published host ports are overridable, because this machine also has an older
# clone of this repo whose stack binds 5542/6479. Either stop that one, or:
#   POSTGRES_PORT=5543 REDIS_PORT=6480 docker compose up -d
name: brollyjuniors-b2c

services:
  # --- data ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brolly
      POSTGRES_PASSWORD: brolly
      POSTGRES_DB: brolly_b2c
      # The schema relies on lower(email) uniqueness and en-GB-ish ordering;
      # pinning the locale keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5542}:5432"
    volumes:
      - brolly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brolly -d brolly_b2c"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps the login throttle counters across a restart, which is
    # the whole point of moving them out of process memory.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6479}:6379"
    volumes:
      - brolly_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- application ---------------------------------------------------------
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Service names, not localhost: inside the network Postgres and Redis
      # answer on their container ports, not the published host ones.
      DATABASE_URL: postgresql://brolly:brolly@postgres:5432/brolly_b2c
      REDIS_URL: redis://redis:6379/0
      # The host default of 127.0.0.1 would only be reachable from inside the
      # container itself, so the web service could never call it.
      HOST: 0.0.0.0
      PORT: "8000"
      WEB_ORIGIN: http://localhost:3000
      # Deliberately NOT production. In production mode the app sets
      # Secure on the refresh cookie (needs HTTPS) and payments.py refuses to
      # run the mock provider at all — both correct, and both would break this
      # stack over plain http://localhost. Flip it only behind TLS with a real
      # PAYMENT_PROVIDER and MEDIA_SIGNING_KEY set.
      NODE_ENV: development
    volumes:
      # RS256 signing keys are generated on first boot. Without this volume
      # every restart mints new ones and signs everybody out.
      - brolly_apikeys:/app/.data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Baked into routes-manifest.json at build time — see frontend/Dockerfile.
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  brolly_pgdata:
  brolly_redisdata:
  brolly_apikeys:
