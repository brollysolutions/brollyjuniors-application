# Brolly Juniors B2C — the whole stack.
#
#   docker compose up -d --build          everything: db, cache, backend, frontend
#   docker compose up -d postgres redis   data services only (host-run apps)
#
# Then open http://localhost:3000. Only the frontend port needs to be open; it
# proxies /api/* to the backend service over the compose network, so the browser
# still sees a single origin and the refresh cookie stays HttpOnly.
#
# A fresh database has schema but no demo users. Seed it once:
#   docker compose run --rm backend python scripts/seed.py
#
# Every published host port is overridable through a variable named after its
# service: FRONTEND_PORT, BACKEND_PORT, POSTGRES_PORT, REDIS_PORT, e.g.
#   POSTGRES_PORT=6543 docker compose up -d
# They exist because an older clone of this repo in a sibling directory binds
# 5542/6479. Both of this stack's data ports have since been moved away from
# those numbers (Postgres 6542, Redis 6579), so that clone no longer clashes.
name: brollyjuniors-b2c

services:
  # --- data ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brolly
      POSTGRES_PASSWORD: brolly
      POSTGRES_DB: brolly_b2c
      # The schema relies on lower(email) uniqueness and en-GB-ish ordering;
      # pinning the locale keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Postgres is told to listen on 6542 inside the container as well, so this
    # service is one number everywhere: the published port, the port in
    # DATABASE_URL over the compose network, and the port in
    # backend/.env.example for a host-run API all read 6542.
    command: ["-p", "6542"]
    ports:
      - "${POSTGRES_PORT:-6542}:6542"
    volumes:
      - brolly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brolly -d brolly_b2c -p 6542"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps the login throttle counters across a restart, which is
    # the whole point of moving them out of process memory.
    # --port 6579 for the same reason as Postgres: one number for this
    # service, host side and container side.
    command: ["redis-server", "--appendonly", "yes", "--port", "6579"]
    ports:
      - "${REDIS_PORT:-6579}:6579"
    volumes:
      - brolly_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6579", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- application ---------------------------------------------------------
  # Named for the directory each one builds from: ./backend and ./frontend.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Service names, not localhost — but the same port numbers as the host
      # mapping, because both servers were told to listen on those ports.
      DATABASE_URL: postgresql://brolly:brolly@postgres:6542/brolly_b2c
      REDIS_URL: redis://redis:6579/0
      # The host default of 127.0.0.1 would only be reachable from inside the
      # container itself, so the frontend service could never call it.
      HOST: 0.0.0.0
      PORT: "8000"
      WEB_ORIGIN: http://localhost:3000
      # Deliberately NOT production. In production mode the app sets
      # Secure on the refresh cookie (needs HTTPS) and payments.py refuses to
      # run the mock provider at all — both correct, and both would break this
      # stack over plain http://localhost. Flip it only behind TLS with a real
      # PAYMENT_PROVIDER and MEDIA_SIGNING_KEY set.
      NODE_ENV: development
    volumes:
      # RS256 signing keys are generated on first boot. Without this volume
      # every restart mints new ones and signs everybody out.
      - brolly_apikeys:/app/.data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into routes-manifest.json at build time — see frontend/Dockerfile.
        API_ORIGIN: http://backend:8000
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  brolly_pgdata:
  brolly_redisdata:
  brolly_apikeys:
