<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brolly School Platform — End-to-End Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* brand */
  --ink:#1E293B; --ink-2:#2C3A4F; --slate:#5F6B7E; --line:#E6E0D4;
  --paper:#FAF7F0; --white:#FFFFFF;
  --cream:#FFF8E7; --chrome-text:#3B4759;
  --blue:#2B6CB0; --blue-soft:#E7EFF9;
  /* primary CTA — always navy text, never white */
  --marigold:#FFC93C; --marigold-hover:#E0A81F; --marigold-soft:#FFF1CE; --cta-text:#1E293B;
  /* status */
  --teal:#15803D; --teal-soft:#E4F3E9;
  --warn:#A16207; --warn-soft:#FBF0D8;
  --rose:#C2321F; --rose-soft:#FBE9E6;
  /* portal accents — set per role on .shell */
  --role:#2B6CB0; --role-soft:#E7EFF9;
  --radius:14px; --shadow:0 1px 2px rgba(30,41,59,.05), 0 8px 24px rgba(30,41,59,.07);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  --sans:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --ui:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --display:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:'cv05','ss01'}
h1,h2,h3,h4{font-family:var(--ui);margin:0;letter-spacing:-.022em;font-weight:600}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
a{color:inherit}
button{font-family:var(--ui);font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}

/* demo bar */
.demobar{position:sticky;top:0;z-index:60;background:var(--cream);color:var(--ink);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;font-size:12px}
.demobar .tag{font-family:var(--ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--marigold);color:var(--cta-text);padding:3px 7px;border-radius:4px;font-weight:600}
.demobar .hint{color:var(--slate)}
.demobar .spacer{flex:1}
.roleswitch{display:flex;gap:4px;flex-wrap:wrap}
.roleswitch button{background:var(--white);color:var(--slate);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px}
.roleswitch button:hover{border-color:var(--slate);color:var(--ink)}
.roleswitch button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.jbtn{background:var(--marigold)!important;color:var(--cta-text)!important;border-color:var(--marigold)!important;font-weight:600}

/* journey drawer */
.jdrawer{position:fixed;inset:0;z-index:80;background:rgba(30,41,59,.6);display:none}
.jdrawer.open{display:block}
.jpanel{position:absolute;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--white);overflow-y:auto;padding:22px;box-shadow:-14px 0 40px rgba(30,41,59,.22)}
.jpanel h2{margin-bottom:4px}
.jpanel .close{position:absolute;top:16px;right:18px;background:none;border:0;font-size:20px;color:var(--slate)}
.jstep{display:flex;gap:12px;padding:11px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:7px;cursor:pointer;background:var(--white);text-align:left;width:100%}
.jstep:hover{border-color:var(--slate)}
.jstep .n{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:20px;padding-top:2px}
.jstep.done{background:var(--teal-soft);border-color:#C6E4D2}
.jstep.done .n{color:var(--teal);font-weight:600}
.jstep .t{font-weight:600;font-size:14px}
.jstep .s{font-size:12.5px;color:var(--slate);margin-top:2px}
.jstep .r{font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-top:5px}
.jprog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0 18px}
.jprog i{display:block;height:100%;background:var(--teal)}

/* boundary chip */
.boundary{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--role-soft);border-left:3px solid var(--role);border-radius:var(--radius);padding:9px 13px;margin-bottom:18px;font-size:13px}
.boundary .eye{font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--role);font-weight:600;white-space:nowrap}
.boundary .what{color:var(--slate)}
.boundary .what strong{color:var(--ink);font-weight:600}

/* shell */
.shell{display:flex;min-height:calc(100vh - 37px)}
.side{width:238px;flex-shrink:0;background:var(--cream);color:var(--chrome-text);padding:18px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.brand{padding:6px 10px 18px;display:flex;align-items:center;gap:9px}
.brand .mark{width:26px;height:26px;border-radius:9px;background:var(--marigold);display:grid;place-items:center;color:var(--cta-text);font-family:var(--display);font-weight:700;font-size:14px}
.brand .nm{font-family:var(--display);color:var(--ink);font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.brand .nm small{display:block;font-family:var(--ui);font-size:9px;letter-spacing:.14em;color:var(--slate);font-weight:400;text-transform:uppercase}
.side nav button{width:100%;text-align:left;background:none;border:0;color:var(--chrome-text);padding:9px 11px;border-radius:8px;font-size:14px;display:flex;gap:9px;align-items:center}
.side nav button:hover{background:rgba(30,41,59,.06);color:var(--ink)}
.side nav button.on{background:var(--role);color:#fff;font-weight:600}
.side nav button .ic{width:16px;text-align:center;opacity:.85;font-size:13px}
.side nav button .badge{margin-left:auto;background:var(--rose);color:#fff;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:999px}
.sidefoot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--slate)}
.sidefoot .who{color:var(--ink);font-weight:600;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .crumb{font-family:var(--ui);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.topbar .spacer{flex:1}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--slate)}
.chip.warn{background:var(--warn-soft);border-color:#EFDCB0;color:var(--warn);font-weight:600}
.chip.act{cursor:pointer}
.chip.act:hover{border-color:var(--slate)}
.content{padding:22px 26px 70px;max-width:1140px;width:100%}
.crumb-l{font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:9px}
.crumb-l a{text-decoration:none;border-bottom:1px solid var(--line)}

/* primitives */
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin-bottom:3px}
.card .sub{color:var(--slate);font-size:13px}
.stat .k{font-family:var(--ui);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.stat .v{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:5px}
.stat .v.small{font-size:23px}
.stat .d{font-size:12px;color:var(--slate);margin-top:2px}
.sechead{display:flex;align-items:flex-end;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sechead:first-of-type{margin-top:0}
.sechead .spacer{flex:1}
.sechead p{margin:2px 0 0;color:var(--slate);font-size:13px}
.btn{background:var(--ink);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.gold{background:var(--marigold);color:var(--cta-text);font-weight:600}
.btn.gold:hover{background:var(--marigold-hover);filter:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--ui);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable:hover{background:var(--paper);cursor:pointer}
.tablewrap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--rose-soft);color:var(--rose)}
.pill.mute{background:var(--paper);color:var(--slate);border:1px solid var(--line)}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;min-width:70px;flex:1}
.bar i{display:block;height:100%;background:var(--role);border-radius:999px}
.bar i.low{background:var(--rose)} .bar i.mid{background:var(--warn)}
.barrow{display:flex;align-items:center;gap:9px;min-width:120px}
.barrow span{font-family:var(--mono);font-size:12px;color:var(--slate);min-width:34px}
.mono{font-family:var(--mono)} .muted{color:var(--slate)} .small{font-size:13px} .tiny{font-size:12px}
.note{background:var(--marigold-soft);border:1px solid #F2DFAE;border-radius:var(--radius);padding:11px 13px;font-size:13px;color:var(--ink);margin-top:16px}
.note strong{color:var(--ink)}
.note.teal{background:var(--teal-soft);border-color:#C6E4D2;color:var(--ink)}
.note.teal strong{color:#0F5132}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:14px;background:var(--white);color:var(--ink)}
.field textarea{min-height:78px;resize:vertical}
.field .help{font-size:12px;color:var(--slate);margin-top:5px}
.steps{display:flex;margin-bottom:18px;flex-wrap:wrap}
.steps div{font-size:12px;padding:6px 13px;border:1px solid var(--line);background:var(--white);color:var(--slate)}
.steps div:first-child{border-radius:8px 0 0 8px}
.steps div:last-child{border-radius:0 8px 8px 0}
.steps div+div{border-left:0}
.steps div.on{background:var(--role);color:#fff;border-color:var(--role);font-weight:600}
.steps div.done{background:var(--teal-soft);color:var(--teal)}
.unit{display:flex;gap:13px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);margin-bottom:9px}
.unit .num{font-family:var(--mono);font-size:11px;color:var(--slate);padding-top:2px;min-width:22px}
.unit .body{flex:1;min-width:0}
.unit .t{font-weight:600}
.unit .m{font-size:13px;color:var(--slate);margin-top:2px}
.unit.locked{opacity:.55}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--white);padding:24px;text-align:center;color:var(--slate);font-size:13px}
.slip{border:1px dashed var(--slate);border-radius:8px;padding:11px 13px;font-size:12.5px;background:var(--white)}
.slip .nm{font-weight:600;font-size:13.5px}
.slip .kv{font-family:var(--mono);font-size:12px;margin-top:4px;color:var(--slate)}
.slip .kv b{color:var(--ink)}

/* editor */
.editor{background:#17212F;border-radius:var(--radius);overflow:hidden;border:1px solid #2E3B4E}
.editor .bar2{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid #2E3B4E;background:#121A26}
.editor .bar2 .fn{font-family:var(--mono);font-size:12px;color:#8DA0BC}
.editor .bar2 .spacer{flex:1}
.editor .bar2 .saved{font-family:var(--mono);font-size:11px;color:var(--teal)}
.editor textarea{width:100%;min-height:200px;background:#17212F;color:#E6EDF6;border:0;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.65;padding:14px}
.editor textarea:focus{outline:none}
.console{background:#121A26;border-top:1px solid #2E3B4E;padding:12px 14px;font-family:var(--mono);font-size:12.5px;color:#C3D0E2;white-space:pre-wrap;min-height:54px}
.console .pass{color:#57C98B} .console .fail{color:#F0857A}
.qcard{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.qcard .qn{font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.qcard .qt{margin:6px 0 12px;font-weight:500}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;background:var(--white)}
.opt:hover{border-color:var(--slate)}
.opt.sel{border-color:var(--role);background:var(--role-soft)}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt .l{font-family:var(--mono);font-size:12px;color:var(--slate);font-weight:600}
.timer{font-family:var(--mono);font-size:13px;background:var(--rose-soft);color:var(--rose);padding:5px 11px;border-radius:999px;font-weight:600}
.lockbox{text-align:center;padding:42px 20px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.lockbox .big{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.03em;margin:10px 0}
.rubric{width:100%;font-size:13px}
.rubric td{padding:9px 10px}
.rubric input[type=number]{width:58px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono)}

/* login */
.login{min-height:calc(100vh - 37px);display:grid;grid-template-columns:1.05fr .95fr}
.login .left{background:var(--cream);color:var(--ink);border-right:1px solid var(--line);padding:52px 46px;display:flex;flex-direction:column;justify-content:center}
.login .left .kicker{font-family:var(--ui);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:16px}
.login .left h1{font-size:40px;line-height:1.06;letter-spacing:-.03em;color:var(--ink);max-width:12ch}
.login .left p{color:var(--slate);max-width:46ch;margin-top:14px}
.login .roles{margin-top:30px;display:grid;gap:8px;max-width:410px}
.login .roles button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--white);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px}
.login .roles button:hover{border-color:var(--slate);box-shadow:var(--shadow)}
.login .roles .n{font-family:var(--mono);font-size:11px;color:var(--marigold);width:18px}
.login .roles .t{font-weight:600;font-size:14px}
.login .roles .s{font-size:12px;color:var(--slate)}
.login .right{display:grid;place-items:center;padding:40px 30px}
.form{width:100%;max-width:335px}
.form .btn{width:100%;margin-top:18px;padding:11px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 28px rgba(30,41,59,.3);z-index:95;animation:pop .25s ease;max-width:90vw;text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* content library */
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.libcard{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.libcard .pad{padding:14px;flex:1;display:flex;flex-direction:column}
.libcard h4{font-family:var(--ui);font-size:14.5px;font-weight:600;margin:7px 0 3px;letter-spacing:-.01em}
.libcard .meta{font-size:12.5px;color:var(--slate);margin-top:auto;padding-top:10px}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#2C3A4F,#1E293B);display:grid;place-items:center;position:relative;color:#fff}
.thumb.mat{background:linear-gradient(135deg,#3C7BC0,#2B6CB0)}
.thumb.lab{background:linear-gradient(135deg,#1B8F6E,#157D77)}
.thumb.exam{background:linear-gradient(135deg,#B87A16,#96630A)}
.thumb .play{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center;font-size:15px;padding-left:3px}
.thumb .dur{position:absolute;bottom:8px;right:8px;background:rgba(30,41,59,.86);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.28)}
.thumb .prog i{display:block;height:100%;background:var(--marigold)}
.tchip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:.03em;text-transform:uppercase;font-family:var(--ui)}
.tchip.mat{background:var(--blue-soft);color:var(--blue)}
.tchip.vid{background:#EFECFF;color:#725AB4}
.tchip.lab{background:var(--teal-soft);color:var(--teal)}
.tchip.exam{background:var(--warn-soft);color:var(--warn)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{background:var(--white);border:1px solid var(--line);color:var(--slate);padding:5px 12px;border-radius:999px;font-size:12.5px}
.filters button:hover{border-color:var(--slate);color:var(--ink)}
.filters button.on{background:var(--role);border-color:var(--role);color:#fff;font-weight:600}
.player{background:#111827;border-radius:var(--radius);overflow:hidden;position:relative;aspect-ratio:16/9;display:grid;place-items:center;color:#8492A6}
.pbar{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#17212F;color:#C3D0E2;font-family:var(--mono);font-size:12px}
.pbar .track{flex:1;height:5px;background:#2E3B4E;border-radius:999px;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--marigold)}
.doc{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:var(--shadow);max-width:720px}
.doc h3{margin:20px 0 8px}
.doc h3:first-child{margin-top:0}
.doc p{margin:0 0 12px;color:#2F3B4E}
.doc ul{margin:0 0 12px;padding-left:20px;color:#2F3B4E}
.doc li{margin-bottom:5px}
@media (max-width:900px){.lib{grid-template-columns:1fr}}
.mobnav{display:none}
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}
  .login{grid-template-columns:1fr} .login .left{padding:34px 22px} .login .left h1{font-size:29px}
  .side{display:none} .content{padding:18px 16px 92px} .topbar{padding:12px 16px}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--cream);border-top:1px solid var(--line);z-index:50;overflow-x:auto;padding:6px;gap:4px}
  .mobnav button{background:none;border:0;color:var(--chrome-text);font-size:12px;padding:8px 12px;border-radius:8px;white-space:nowrap}
  .mobnav button.on{background:var(--role);color:#fff;font-weight:600}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="demobar">
  <span class="tag">Prototype</span>
  <span class="hint">Every screen is clickable. Switch role to follow the same work through a different login.</span>
  <span class="spacer"></span>
  <div class="roleswitch" id="roleswitch"></div>
</div>
<div id="app"></div>

    <p>A program becomes useful when it can ask a question and use the answer. In Python that is done with <span class="mono">input()</span>.</p>
    <h3>The rule to remember</h3>
    <p><span class="mono">input()</span> always gives you <strong>text</strong>. Even when the person types 25, Python holds it as the characters "2" and "5", not the number twenty-five.</p>
    <h3>Three things that go wrong</h3>
    <ul>
      <li>Adding to text instead of a number, so 25 + 1 becomes an error</li>
      <li>Forgetting the space at the end of the question, so the answer sticks to the question</li>
      <li>Using <span class="mono">int()</span> on something that is not a number at all</li>

/* ================= JOURNEY PANEL ================= */

  const p=Math.round(S.done.size/JOURNEY.length*100);
  el('jpanel').innerHTML=`
  <button class="close" data-act="jclose">×</button>
  <h2>The end-to-end chain</h2>
  <p class="small muted" style="margin:4px 0 0">Fifteen steps, four logins, one line of work. Tap any step to jump straight to that screen.</p>
  <div class="jprog"><i style="width:${p}%"></i></div>
  <div class="tiny muted mono" style="margin:-10px 0 14px;letter-spacing:.1em;text-transform:uppercase">${S.done.size} of ${JOURNEY.length} visited</div>
  ${JOURNEY.map(j=>`<button class="jstep ${S.done.has(j.id)?'done':''}" data-j="${j.id}">
    <span class="n">${S.done.has(j.id)?'✓':String(j.id).padStart(2,'0')}</span>
    <span><span class="t">${j.t}</span><div class="s">${j.s}</div><div class="r">${ROLES[j.role].label}</div></span></button>`).join('')}

  el('jdrawer').classList.toggle('open',S.jopen);
}

/* ================= RENDER ================= */
const SCREENS={b_overview,b_schools,b_addschool,b_school,b_content,b_licences,b_reports,
  s_overview,s_teachers,s_addteacher,s_students,s_bulk,s_classes,s_addclass,s_class,s_exams,s_reports,
  t_classes,t_class,t_student,t_assign,t_library,t_labs,t_grade,t_exams,t_schedule,t_mark,t_announce,t_create,t_reports,t_profile,
  p_home,p_videos,p_videoview,p_materials,p_materialview,p_practice,p_practicelab,p_lab,p_labupload,p_exam,p_results,p_file,p_profile,b_profile,s_profile};

function renderRoleSwitch(){
  el('roleswitch').innerHTML=
    `<button class="jbtn" data-act="jopen">Journey ${S.done.size}/${JOURNEY.length}</button>`+
    `<button data-role="" class="${!S.role?'on':''}">Login</button>`+
    Object.keys(ROLES).map(r=>`<button data-role="${r}" class="${S.role===r?'on':''}" style="${S.role===r?`background:${ROLES[r].accent};color:#fff;border-color:${ROLES[r].accent}`:''}">${ROLES[r].label}</button>`).join('');
}
function render(){
  renderRoleSwitch(); renderJourney();
  const app=el('app');
  if(!S.role){app.innerHTML=scr_login();return;}
  const R=ROLES[S.role];
  const body=(SCREENS[S.screen]||SCREENS[R.nav[0][0]])();
  const onNav=n=>R.nav.some(x=>x[0]===S.screen)?S.screen===n:n===R.nav[0][0];
  app.innerHTML=`<div class="shell" style="--role:${R.accent};--role-soft:${R.accentSoft}">
    <aside class="side">
      <div class="brand"><div class="mark">B</div><div class="nm">Brolly<small>${R.label}</small></div></div>
      <nav>${R.nav.map(n=>`<button data-go="${n[0]}" class="${onNav(n[0])?'on':''}"><span class="ic">${n[2]}</span>${n[1]}${n[3]?`<span class="badge">${n[3]}</span>`:''}</button>`).join('')}</nav>
      <div class="sidefoot"><div class="who">${R.who}</div>${R.sub}<div style="margin-top:8px"><button class="btn ghost sm" data-role="">Sign out</button></div></div>
    </aside>
    <div class="main">
      <div class="topbar"><span class="crumb">${R.label}</span><span class="spacer"></span>
        ${S.role==='brolly'?'<span class="chip">Synced from Hub · v112</span>':''}
        ${S.role==='teacher'?'<span class="chip act" data-act="switchschool">Vidya Vihar High School ▾</span>':''}
        <span class="chip">${R.who}</span></div>
      <div class="content">
        <div class="boundary"><span class="eye">Can see</span><span class="what"><strong>${R.boundary}</strong> — nothing outside this line, on any screen.</span></div>
        ${body}
      </div>
    </div></div>
  <div class="mobnav" style="--role:${R.accent}">${R.nav.map(n=>`<button data-go="${n[0]}" class="${onNav(n[0])?'on':''}">${n[1]}</button>`).join('')}</div>`;
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-j]');
  if(j){e.preventDefault();jgo(JOURNEY.find(x=>x.id===+j.getAttribute('data-j')));return;}
  const r=e.target.closest('[data-role]');
  if(r){e.preventDefault();setRole(r.getAttribute('data-role')||null);return;}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.getAttribute('data-go'),g.getAttribute('data-p'));return;}
  const a=e.target.closest('[data-act]');
  if(!a)return;
  e.preventDefault();
  const act=a.getAttribute('data-act');

  if(act==='jopen'){S.jopen=true;renderJourney();return;}
  if(act==='jclose'){S.jopen=false;renderJourney();return;}
  if(act==='pick'){S.sel[+a.getAttribute('data-q')]=+a.getAttribute('data-o');render();toast('Answer saved');return;}
  if(act==='check'){S.checkSel[+a.getAttribute('data-q')]=+a.getAttribute('data-o');render();return;}
  if(act==='lstep'){S.lessonStep=+a.getAttribute('data-i');render();window.scrollTo(0,0);return;}
  if(act==='lessondone'){S.lessonStep=0;toast('Lesson complete — the next one just unlocked');go('p_lessons');return;}
  if(act==='runtry'||act==='runlab'){
    const out=el(act==='runtry'?'tryout':'labout');
    const src=el(act==='runtry'?'tryit':'labcode').value;
    out.innerHTML='Running…';
    setTimeout(()=>{
      if(!el(act==='runtry'?'tryout':'labout'))return;
      if(act==='runtry'){out.innerHTML='What is your name? Aarav\nHello, Aarav';}
      else{
        S.labCode=src;
        const looped=/for\s+\w+\s+in/.test(src)||/while/.test(src);
        const printed=/print/.test(src);
        const rounded=/round\s*\(/.test(src);
        out.innerHTML=!printed?'Nothing was printed.\nAdd a print() line so we can see your answer.'
          :!looped?'<span class="fail">Test 1 failed</span>\nThe task asks you to add the marks with a loop. No loop found in your code.'
          :rounded?'Average: 74.0\n\n<span class="pass">Test 1 passed</span>  ·  <span class="pass">Test 2 passed</span>  ·  <span class="pass">Test 3 passed</span>\nAll tests passed. You can submit this.'
          :'Average: 74.0\n\n<span class="pass">Test 1 passed</span>  ·  <span class="pass">Test 2 passed</span>  ·  <span class="fail">Test 3 failed</span>\nHidden test wanted the answer rounded to 2 decimals. Try round(...).';
      }
    },480);
    return;
  }
  if(act==='submitlab'){toast('Submitted to Sneha ma\u2019am for grading');go('p_file');return;}
  if(act==='uploaded'){toast('Lab report uploaded — your teacher can see it now');go('p_file');return;}
  if(act==='startexam'){S.examStep=1;render();startTimer();return;}
  if(act==='drop'){S.examStep=2;render();return;}
  if(act==='reconnect'){S.examStep=1;render();startTimer();toast('Reconnected — '+Object.keys(S.sel).length+' answers restored');return;}
  if(act==='submitexam'){S.examStep=3;render();return;}
  if(act==='resetexam'){S.examStep=0;S.sel={};render();return;}
  if(act==='markone'){S.marks[+a.getAttribute('data-i')]=true;render();toast('Mark saved');return;}
  if(act==='release'){toast('Results released to 38 students');go('t_exams');return;}
  if(act==='scheduled'){toast('Exam scheduled · 25 Aug, 10:00 · locked until then');go('t_exams');return;}
  if(act==='assigned'){toast('Assigned to 38 students, due 28 August');go('t_class');return;}
  if(act==='graded'){toast('Grade sent');go('t_labs');return;}
  if(act==='revise'){toast('Sent back for revision — no attempt used');go('t_labs');return;}
  if(act==='announced'){toast('Posted to 38 students');return;}
  if(act==='schoolcreated'){step(1);toast('School created. Login details emailed to the school admin.');go('b_licences');return;}
  if(act==='licsaved'){step(2);toast('Licence saved — 120 seats, Class 9, valid to 31 Mar 2027');return;}
  if(act==='teachercreated'){step(3);toast('Teacher login created and emailed');go('s_teachers');return;}
  if(act==='classcreated'){step(5);toast('9-A created with 38 students and one teacher');go('s_classes');return;}
  if(act==='bulkdone'){step(4);toast('38 slips ready to print · 36 seats left');go('s_students');return;}
  if(act==='deactivate'){toast('Deactivated. Their grading history stays with the students.');return;}
  if(act==='resetpw'){toast('Temporary password generated');return;}
  if(act==='switchschool'){toast('In the real app: switch to your other school. Neither school sees the other.');return;}
  if(act==='exportfile'){toast('Unlocks when all 15 programs are approved');return;}
  if(act==='profilesaved'){toast('Saved');return;}
  if(act==='pwchanged'){toast('Password updated');return;}
  if(act==='blockadded'){toast('Added to your lesson');return;}
  if(act==='materialshared'){toast('Shared with 9-A · 38 students can see it now');go('t_create','mine');return;}
  if(act==='materialsaved'){toast('Saved as draft — students cannot see it yet');go('t_create','mine');return;}
  if(act==='curriculumsaved'){toast('Curriculum saved for 9-A Term 2');return;}
  if(act==='notesaved'){toast('Note saved');return;}
  if(act==='markread'){toast('Marked as read');go('p_materials');return;}
  if(act==='opensHub'){toast('Opens hub.brolly.com — a separate site, shared by every app');return;}
  if(act==='soon'){toast('Not built in this prototype — the flow is what matters here');return;}
});
document.addEventListener('click',e=>{if(e.target.id==='jdrawer'){S.jopen=false;renderJourney();}});

let timerId=null;
function startTimer(){
  clearInterval(timerId);
  let s=42*60+18;
  timerId=setInterval(()=>{
    const t=el('timer');
    if(!t){clearInterval(timerId);return;}
    s--;t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} left`;
  },1000);
}
setInterval(()=>{['savemark','labsave'].forEach(id=>{
  const n=el(id);
  if(n){n.textContent='saving…';setTimeout(()=>{const m=el(id);if(m)m.textContent='saved just now';},420);}
});},9000);

render();

</script>
